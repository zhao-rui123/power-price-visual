<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全国分时电价可视化查询系统</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.9);
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .control-panel {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-weight: 600;
            color: #333;
            font-size: 0.9em;
        }
        select {
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            min-width: 150px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        select:hover, select:focus {
            border-color: #667eea;
            outline: none;
        }
        .chart-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            min-height: 500px;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: 500;
            color: white;
        }
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 3px;
        }
        .update-info {
            text-align: center;
            color: rgba(255,255,255,0.8);
            margin-top: 20px;
            font-size: 0.9em;
        }
        .placeholder {
            text-align: center;
            color: #999;
            padding: 100px 0;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ 全国分时电价可视化查询系统</h1>
        <p class="subtitle">选择省份和月份，查看24小时分时电价分布</p>
        
        <div class="control-panel">
            <div class="control-group">
                <label>选择省份</label>
                <select id="provinceSelect">
                    <option value="">请选择省份</option>
                    <option value="河南">河南</option>
                    <option value="江苏">江苏</option>
                    <option value="广东">广东</option>
                    <option value="山东">山东</option>
                </select>
            </div>
            <div class="control-group">
                <label>选择月份</label>
                <select id="monthSelect">
                    <option value="">请选择月份</option>
                    <option value="1">1月</option>
                    <option value="2">2月</option>
                    <option value="3">3月</option>
                    <option value="4">4月</option>
                    <option value="5">5月</option>
                    <option value="6">6月</option>
                    <option value="7">7月</option>
                    <option value="8">8月</option>
                    <option value="9">9月</option>
                    <option value="10">10月</option>
                    <option value="11">11月</option>
                    <option value="12">12月</option>
                </select>
            </div>
        </div>
        
        <div class="chart-container">
            <div class="legend">
                <div class="legend-item" style="background: linear-gradient(135deg, #00f2fe, #4facfe);">
                    <div class="legend-color" style="background: #00f2fe;"></div>
                    深谷 0.4x
                </div>
                <div class="legend-item" style="background: linear-gradient(135deg, #3498db, #2980b9);">
                    <div class="legend-color" style="background: #3498db;"></div>
                    低谷 0.6x
                </div>
                <div class="legend-item" style="background: linear-gradient(135deg, #4ecdc4, #44a08d);">
                    <div class="legend-color" style="background: #4ecdc4;"></div>
                    平段 1.0x
                </div>
                <div class="legend-item" style="background: linear-gradient(135deg, #f39c12, #e67e22);">
                    <div class="legend-color" style="background: #f39c12;"></div>
                    高峰 1.6x
                </div>
                <div class="legend-item" style="background: linear-gradient(135deg, #e74c3c, #c0392b);">
                    <div class="legend-color" style="background: #e74c3c;"></div>
                    尖峰 2.0x
                </div>
            </div>
            <div id="chartWrapper">
                <div class="placeholder">请选择省份和月份查看电价分布</div>
            </div>
        </div>
        
        <p class="update-info">数据更新时间：2026年2月 | 每月更新</p>
    </div>

    <script>
        // 电价倍数
        const multipliers = {
            'deep': 0.4,
            'valley': 0.6,
            'flat': 1.0,
            'peak': 1.6,
            'sharp': 2.0
        };

        // 颜色
        const colors = {
            'deep': '#00f2fe',
            'valley': '#3498db',
            'flat': '#4ecdc4',
            'peak': '#f39c12',
            'sharp': '#e74c3c'
        };

        // 数据
        const data = {
            '河南': {
                '1': {name: '1月、2月、12月', slots: [
                    {h:0,t:'valley'},{h:1,t:'valley'},{h:2,t:'valley'},{h:3,t:'valley'},{h:4,t:'valley'},{h:5,t:'valley'},{h:6,t:'valley'},{h:7,t:'valley'},
                    {h:8,t:'flat'},{h:9,t:'flat'},{h:10,t:'flat'},{h:11,t:'flat'},{h:12,t:'flat'},{h:13,t:'flat'},{h:14,t:'flat'},{h:15,t:'flat'},
                    {h:16,t:'sharp'},{h:17,t:'sharp'},{h:18,t:'peak'},{h:19,t:'sharp'},{h:20,t:'peak'},{h:21,t:'peak'},{h:22,t:'peak'},{h:23,t:'peak'}
                ]},
                '2': {name: '1月、2月、12月', slots: [
                    {h:0,t:'valley'},{h:1,t:'valley'},{h:2,t:'valley'},{h:3,t:'valley'},{h:4,t:'valley'},{h:5,t:'valley'},{h:6,t:'valley'},{h:7,t:'valley'},
                    {h:8,t:'flat'},{h:9,t:'flat'},{h:10,t:'flat'},{h:11,t:'flat'},{h:12,t:'flat'},{h:13,t:'flat'},{h:14,t:'flat'},{h:15,t:'flat'},
                    {h:16,t:'peak'},{h:17,t:'peak'},{h:18,t:'peak'},{h:19,t:'peak'},{h:20,t:'peak'},{h:21,t:'peak'},{h:22,t:'peak'},{h:23,t:'peak'}
                ]},
                '7': {name: '6-8月', slots: [
                    {h:0,t:'valley'},{h:1,t:'valley'},{h:2,t:'valley'},{h:3,t:'valley'},{h:4,t:'valley'},{h:5,t:'valley'},{h:6,t:'valley'},{h:7,t:'valley'},
                    {h:8,t:'flat'},{h:9,t:'flat'},{h:10,t:'flat'},{h:11,t:'flat'},{h:12,t:'flat'},{h:13,t:'flat'},{h:14,t:'flat'},{h:15,t:'flat'},
                    {h:16,t:'peak'},{h:17,t:'peak'},{h:18,t:'peak'},{h:19,t:'peak'},{h:20,t:'sharp'},{h:21,t:'sharp'},{h:22,t:'sharp'},{h:23,t:'peak'}
                ]}
            },
            '江苏': {
                '1': {name: '冬季', slots: [
                    {h:0,t:'valley'},{h:1,t:'valley'},{h:2,t:'valley'},{h:3,t:'valley'},{h:4,t:'valley'},{h:5,t:'valley'},{h:6,t:'valley'},
                    {h:7,t:'flat'},{h:8,t:'flat'},{h:9,t:'flat'},{h:10,t:'flat'},{h:11,t:'valley'},{h:12,t:'valley'},{h:13,t:'valley'},
                    {h:14,t:'peak'},{h:15,t:'peak'},{h:16,t:'peak'},{h:17,t:'peak'},{h:18,t:'peak'},{h:19,t:'peak'},{h:20,t:'peak'},{h:21,t:'peak'},{h:22,t:'peak'},{h:23,t:'flat'}
                ]}
            },
            '广东': {
                '1': {name: '全年', slots: [
                    {h:0,t:'valley'},{h:1,t:'valley'},{h:2,t:'valley'},{h:3,t:'valley'},{h:4,t:'valley'},{h:5,t:'valley'},{h:6,t:'valley'},{h:7,t:'valley'},
                    {h:8,t:'flat'},{h:9,t:'flat'},{h:10,t:'peak'},{h:11,t:'sharp'},{h:12,t:'peak'},{h:13,t:'peak'},{h:14,t:'peak'},{h:15,t:'sharp'},{h:16,t:'sharp'},{h:17,t:'sharp'},{h:18,t:'peak'},{h:19,t:'peak'},
                    {h:20,t:'flat'},{h:21,t:'flat'},{h:22,t:'flat'},{h:23,t:'flat'}
                ]}
            },
            '山东': {
                '1': {name: '冬季', slots: [
                    {h:0,t:'valley'},{h:1,t:'valley'},{h:2,t:'valley'},{h:3,t:'valley'},{h:4,t:'valley'},{h:5,t:'valley'},{h:6,t:'valley'},{h:7,t:'valley'},
                    {h:8,t:'flat'},{h:9,t:'flat'},{h:10,t:'flat'},{h:11,t:'flat'},{h:12,t:'flat'},{h:13,t:'flat'},{h:14,t:'flat'},{h:15,t:'flat'},
                    {h:16,t:'peak'},{h:17,t:'peak'},{h:18,t:'peak'},{h:19,t:'peak'},{h:20,t:'peak'},{h:21,t:'peak'},{h:22,t:'peak'},{h:23,t:'flat'}
                ]}
            }
        };

        let myChart = null;

        function renderChart() {
            const province = document.getElementById('provinceSelect').value;
            const month = document.getElementById('monthSelect').value;
            
            if (!province || !month) return;
            
            const pdata = data[province];
            if (!pdata || !pdata[month]) {
                alert('暂无该省份' + month + '月数据');
                return;
            }
            
            const d = pdata[month];
            const hours = d.slots.map(s => s.h + ':00');
            const values = d.slots.map(s => multipliers[s.t]);
            const barColors = d.slots.map(s => colors[s.t]);
            
            const ctx = document.createElement('canvas');
            ctx.id = 'myChart';
            ctx.style.maxHeight = '500px';
            
            document.getElementById('chartWrapper').innerHTML = '';
            document.getElementById('chartWrapper').appendChild(ctx);
            
            if (myChart) myChart.destroy();
            
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: hours,
                    datasets: [{
                        label: '电价倍数',
                        data: values,
                        backgroundColor: barColors,
                        borderWidth: 1,
                        borderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        title: {
                            display: true,
                            text: province + ' ' + month + '月 ' + d.name + ' 24小时电价分布',
                            font: { size: 18 }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(c) {
                                    const names = {deep:'深谷',valley:'低谷',flat:'平段',peak:'高峰',sharp:'尖峰'};
                                    const t = d.slots[c.dataIndex].t;
                                    return names[t] + ': ' + c.parsed.y + 'x';
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 2.2,
                            title: { display: true, text: '电价倍数' }
                        },
                        x: {
                            title: { display: true, text: '时段' }
                        }
                    }
                }
            });
        }

        document.getElementById('provinceSelect').addEventListener('change', renderChart);
        document.getElementById('monthSelect').addEventListener('change', renderChart);
    </script>
</body>
</html>
