<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全国分时电价可视化查询系统</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.9);
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .control-panel {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-weight: 600;
            color: #333;
            font-size: 0.9em;
        }
        select {
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            min-width: 150px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        select:hover, select:focus {
            border-color: #667eea;
            outline: none;
        }
        .chart-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 500;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }
        .update-info {
            text-align: center;
            color: rgba(255,255,255,0.8);
            margin-top: 20px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ 全国分时电价可视化查询系统</h1>
        <p class="subtitle">选择省份和月份，查看24小时分时电价分布</p>
        
        <div class="control-panel">
            <div class="control-group">
                <label>选择省份</label>
                <select id="provinceSelect">
                    <option value="">请选择省份</option>
                </select>
            </div>
            <div class="control-group">
                <label>选择月份</label>
                <select id="monthSelect">
                    <option value="">请选择月份</option>
                    <option value="1">1月</option>
                    <option value="2">2月</option>
                    <option value="3">3月</option>
                    <option value="4">4月</option>
                    <option value="5">5月</option>
                    <option value="6">6月</option>
                    <option value="7">7月</option>
                    <option value="8">8月</option>
                    <option value="9">9月</option>
                    <option value="10">10月</option>
                    <option value="11">11月</option>
                    <option value="12">12月</option>
                </select>
            </div>
        </div>
        
        <div class="chart-container">
            <div class="legend">
                <div class="legend-item" style="background: #00f2fe; color: white;">
                    <div class="legend-color" style="background: #00f2fe;"></div>
                    深谷
                </div>
                <div class="legend-item" style="background: #3498db; color: white;">
                    <div class="legend-color" style="background: #3498db;"></div>
                    低谷
                </div>
                <div class="legend-item" style="background: #4ecdc4; color: white;">
                    <div class="legend-color" style="background: #4ecdc4;"></div>
                    平段
                </div>
                <div class="legend-item" style="background: #f39c12; color: white;">
                    <div class="legend-color" style="background: #f39c12;"></div>
                    高峰
                </div>
                <div class="legend-item" style="background: #e74c3c; color: white;">
                    <div class="legend-color" style="background: #e74c3c;"></div>
                    尖峰
                </div>
            </div>
            <canvas id="priceChart"></canvas>
        </div>
        
        <p class="update-info">数据更新时间：2026年2月 | 每月更新</p>
    </div>

    <script>
        // 电价倍数：深谷0.4，低谷0.6，平段1.0，高峰1.6，尖峰2.0
        const priceMultipliers = {
            'deep': 0.4,   // 深谷
            'valley': 0.6, // 低谷
            'flat': 1.0,   // 平段
            'peak': 1.6,   // 高峰
            'sharp': 2.0   // 尖峰
        };

        // 颜色配置
        const colors = {
            'deep': '#00f2fe',   // 深谷 - 浅蓝
            'valley': '#3498db', // 低谷 - 蓝色
            'flat': '#4ecdc4',   // 平段 - 青绿
            'peak': '#f39c12',   // 高峰 - 橙色
            'sharp': '#e74c3c'   // 尖峰 - 红色
        };

        // 省份数据（2026年2月数据）
        const provinceData = {
            '河南': {
                '1': { 
                    slots: [
                        {hour: 0, type: 'valley'}, {hour: 1, type: 'valley'}, {hour: 2, type: 'valley'},
                        {hour: 3, type: 'valley'}, {hour: 4, type: 'valley'}, {hour: 5, type: 'valley'},
                        {hour: 6, type: 'valley'}, {hour: 7, type: 'valley'},
                        {hour: 8, type: 'flat'}, {hour: 9, type: 'flat'}, {hour: 10, type: 'flat'},
                        {hour: 11, type: 'flat'}, {hour: 12, type: 'flat'}, {hour: 13, type: 'flat'},
                        {hour: 14, type: 'flat'}, {hour: 15, type: 'flat'},
                        {hour: 16, type: 'sharp'}, {hour: 17, type: 'sharp'}, {hour: 18, type: 'peak'},
                        {hour: 19, type: 'sharp'}, {hour: 20, type: 'peak'}, {hour: 21, type: 'peak'},
                        {hour: 22, type: 'peak'}, {hour: 23, type: 'peak'}
                    ]
                },
                '2': {
                    slots: [
                        {hour: 0, type: 'valley'}, {hour: 1, type: 'valley'}, {hour: 2, type: 'valley'},
                        {hour: 3, type: 'valley'}, {hour: 4, type: 'valley'}, {hour: 5, type: 'valley'},
                        {hour: 6, type: 'valley'}, {hour: 7, type: 'valley'},
                        {hour: 8, type: 'flat'}, {hour: 9, type: 'flat'}, {hour: 10, type: 'flat'},
                        {hour: 11, type: 'flat'}, {hour: 12, type: 'flat'}, {hour: 13, type: 'flat'},
                        {hour: 14, type: 'flat'}, {hour: 15, type: 'flat'},
                        {hour: 16, type: 'peak'}, {hour: 17, type: 'peak'}, {hour: 18, type: 'peak'},
                        {hour: 19, type: 'peak'}, {hour: 20, type: 'peak'}, {hour: 21, type: 'peak'},
                        {hour: 22, type: 'peak'}, {hour: 23, type: 'peak'}
                    ]
                },
                '7': {
                    slots: [
                        {hour: 0, type: 'valley'}, {hour: 1, type: 'valley'}, {hour: 2, type: 'valley'},
                        {hour: 3, type: 'valley'}, {hour: 4, type: 'valley'}, {hour: 5, type: 'valley'},
                        {hour: 6, type: 'valley'}, {hour: 7, type: 'valley'},
                        {hour: 8, type: 'flat'}, {hour: 9, type: 'flat'}, {hour: 10, type: 'flat'},
                        {hour: 11, type: 'flat'}, {hour: 12, type: 'flat'}, {hour: 13, type: 'flat'},
                        {hour: 14, type: 'flat'}, {hour: 15, type: 'flat'},
                        {hour: 16, type: 'peak'}, {hour: 17, type: 'peak'}, {hour: 18, type: 'peak'},
                        {hour: 19, type: 'peak'}, {hour: 20, type: 'sharp'}, {hour: 21, type: 'sharp'},
                        {hour: 22, type: 'sharp'}, {hour: 23, type: 'peak'}
                    ]
                }
            },
            '江苏': {
                '1': {
                    slots: [
                        {hour: 0, type: 'valley'}, {hour: 1, type: 'valley'}, {hour: 2, type: 'valley'},
                        {hour: 3, type: 'valley'}, {hour: 4, type: 'valley'}, {hour: 5, type: 'valley'},
                        {hour: 6, type: 'valley'},
                        {hour: 7, type: 'flat'}, {hour: 8, type: 'flat'}, {hour: 9, type: 'flat'},
                        {hour: 10, type: 'flat'}, {hour: 11, type: 'valley'},
                        {hour: 12, type: 'valley'}, {hour: 13, type: 'valley'},
                        {hour: 14, type: 'peak'}, {hour: 15, type: 'peak'},
                        {hour: 16, type: 'peak'}, {hour: 17, type: 'peak'}, {hour: 18, type: 'peak'},
                        {hour: 19, type: 'peak'}, {hour: 20, type: 'peak'}, {hour: 21, type: 'peak'},
                        {hour: 22, type: 'peak'},
                        {hour: 23, type: 'flat'}
                    ]
                }
            },
            '广东': {
                '1': {
                    slots: [
                        {hour: 0, type: 'valley'}, {hour: 1, type: 'valley'}, {hour: 2, type: 'valley'},
                        {hour: 3, type: 'valley'}, {hour: 4, type: 'valley'}, {hour: 5, type: 'valley'},
                        {hour: 6, type: 'valley'}, {hour: 7, type: 'valley'},
                        {hour: 8, type: 'flat'}, {hour: 9, type: 'flat'}, {hour: 10, type: 'peak'},
                        {hour: 11, type: 'sharp'}, {hour: 12, type: 'peak'},
                        {hour: 13, type: 'peak'}, {hour: 14, type: 'peak'},
                        {hour: 15, type: 'sharp'}, {hour: 16, type: 'sharp'}, {hour: 17, type: 'sharp'},
                        {hour: 18, type: 'peak'}, {hour: 19, type: 'peak'},
                        {hour: 20, type: 'flat'}, {hour: 21, type: 'flat'}, {hour: 22, type: 'flat'},
                        {hour: 23, type: 'flat'}
                    ]
                }
            }
        };

        // 初始化省份选择
        const provinceSelect = document.getElementById('provinceSelect');
        Object.keys(provinceData).forEach(province => {
            const option = document.createElement('option');
            option.value = province;
            option.textContent = province;
            provinceSelect.appendChild(option);
        });

        let chart = null;

        function updateChart() {
            const province = provinceSelect.value;
            const month = document.getElementById('monthSelect').value;
            
            if (!province || !month) return;
            
            const data = provinceData[province][month];
            if (!data) {
                alert('该省份暂无' + month + '月数据');
                return;
            }
            
            // 准备图表数据
            const hours = data.slots.map(s => s.hour + ':00');
            const prices = data.slots.map(s => priceMultipliers[s.type]);
            const barColors = data.slots.map(s => colors[s.type]);
            
            const ctx = document.getElementById('priceChart').getContext('2d');
            
            if (chart) {
                chart.destroy();
            }
            
            chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: hours,
                    datasets: [{
                        label: province + ' ' + month + '月 24小时电价分布',
                        data: prices,
                        backgroundColor: barColors,
                        borderWidth: 1,
                        borderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: false
                        },
                        title: {
                            display: true,
                            text: province + ' ' + month + '月 24小时分时电价分布',
                            font: { size: 20, weight: 'bold' },
                            padding: 20
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const typeNames = {
                                        'deep': '深谷',
                                        'valley': '低谷', 
                                        'flat': '平段',
                                        'peak': '高峰',
                                        'sharp': '尖峰'
                                    };
                                    const slot = data.slots[context.dataIndex];
                                    return typeNames[slot.type] + ': ' + context.parsed.y + '倍';
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 2.2,
                            title: {
                                display: true,
                                text: '电价倍数（以平段为基准）',
                                font: { size: 14, weight: 'bold' }
                            },
                            ticks: {
                                callback: function(value) {
                                    return value + 'x';
                                }
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: '时段',
                                font: { size: 14, weight: 'bold' }
                            },
                            ticks: {
                                maxRotation: 45
                            }
                        }
                    }
                }
            });
        }

        // 监听选择变化
        provinceSelect.addEventListener('change', updateChart);
        document.getElementById('monthSelect').addEventListener('change', updateChart);
    </script>
</body>
</html>
